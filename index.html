<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Podium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="podium">
            <!-- Second Place -->
            <div class="team">
                <div class="carousel">
                    <img src="./assets/argentina1.jpg" alt="Match 1">
                    <img src="./assets/argentina2.jpg" alt="Match 2">
                    <img src="./assets/argentina3.webp" alt="Match 3">
                </div>
                <img src="./assets/argentina.svg" alt="Argentina" class="flag">
                <div class="name">Argentina</div>
                <div class="podium-block second">2</div>
            </div>

            <!-- First Place -->
            <div class="team">
                <div class="carousel">
                    <img src="./assets/spain1.jpg" alt="Match 1">
                    <img src="./assets/spain2.jpg" alt="Match 2">
                    <img src="./assets/spain3.jpg" alt="Match 3">
                </div>
                <img src="./assets/spain.svg" alt="Spain" class="flag">
                <div class="name">Spain</div>
                <div class="podium-block first">1</div>
            </div>

            <!-- Third Place -->        
            <div class="team">
                <div class="carousel">
                    <img src="./assets/inglaterra1.jpg" alt="Match 1">
                    <img src="./assets/inglaterra2.jpg" alt="Match 2">
                    <img src="./assets/inglaterra3.webp" alt="Match 3">
                </div>
                <img src="./assets/england.svg" alt="England" class="flag">
                <div class="name">England</div>
                <div class="podium-block third">3</div>
            </div>
        </div>
    </div>

</body>
</html>
